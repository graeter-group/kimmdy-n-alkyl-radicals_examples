dryrun: false
name: 'HAT_000'
max_tasks: 100
gromacs_alias: 'gmx_mpi'
gmx_mdrun_flags: -maxh 24 -ntomp 1
mdrun_prefix: "srun --ntasks=1 --cpus-per-task=1"
  #ff: 'amber99sb-star-ildnp.ff' # optional, dir endinng with .ff by default 
top: 'topol.top'
gro: 'mol.gro'
ndx: 'index.ndx'
trr: 'equilibrium.trr'
tpr: 'equilibrium.tpr'
radicals: 'Y'
mds:
  equilibrium:
    mdp: 'sd.mdp'
  relax:
    mdp: 'sd_slowgrowth.mdp'
changer:
  coordinates:
    md: 'relax'  
    slow_growth: 'morse_only'
  topology:
    parameterization: 'grappa'
    parameterization_kwargs:
      grappa_tag: 'grappa-1.4.1-radical'
reactions:
  hat_reaction:
    model: 'mace'
    kmc: 'rfkmc'
    h_cutoff: 3
    polling_rate: 1
    keep_structures: False
    cap: True 
    prediction_scheme: 'all_models'
    n_unique: 100000
    trajectory_format: 'trr'
    change_coords: 'lambda'
    rate_equation: 'eyring'
    eyring_equation:
      temperature: 500
      transmission_coefficient: 1
sequence:
- reactions

